<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Paramore fan experience — music, albums, events and registration." />
  <title>PARAMORE — The Experience</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Paramore home">PARAMORE</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav class="nav" id="nav">
        <a href="#home" data-route="home">HOME</a>
        <a href="#albums" data-route="albums">ALBUMS</a>
        <a href="#events" data-route="events">EVENTS</a>
        <a href="#register" data-route="register">REGISTER</a>
      </nav>
    </header>

    <main id="page"></main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
